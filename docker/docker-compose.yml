services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256" # Force l'authentification (connexion locale et distant)
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Volume persistant
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  api:
    build:
      context: ../back # Contexte relatif depuis le docker-compose.yml
      dockerfile: Dockerfile-api
    container_name: spring-boot-api
    ports:
      - "${API_PORT}:8080"
    depends_on:
      - db
    networks:
      - app-network

# Persiste les données
volumes:
 postgres_data:

# Met en réseau les services
networks:
  app-network:
    driver: bridge